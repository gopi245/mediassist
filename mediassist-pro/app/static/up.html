<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Send photos</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/app.css">
</head><body class="public">
<main class="pub-wrap">
  <div class="brand dark"><div class="mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 2h4v6h6v4h-6v6H8v-6H2V8h6z"/></svg></div><div><b id="upBranch">MediAssist</b><span id="upLabel">Send photos to the computer</span></div></div>
  <div class="card stack" id="upCard">
    <label class="drop up-big" for="upFile"><b>Take a photo</b><span class="small muted">or choose one from the gallery</span></label>
    <input type="file" id="upFile" accept="image/jpeg,image/png,image/webp,application/pdf" capture="environment" hidden>
    <div id="upMsg" role="status" class="small"></div>
    <div id="upList" class="up-list"></div>
  </div>
  <p class="small muted" style="text-align:center">Photos go straight to the computer that showed the QR code. This page stops working after 15 minutes.</p>
</main>
<script src="/js/upload.js"></script>
</body></html>
